# Évite la mise en pause du projet Supabase gratuit (après 7 jours sans activité).
# Appelle la fonction public.maintenir_actif() tous les 3 jours.
# La clé utilisée est la clé publique "anon", déjà présente dans js/config.js.
name: Maintenir Supabase actif

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appel de la base
        env:
          URL: https://ryfjulxsknibszxlznau.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5Zmp1bHhza25pYnN6eGx6bmF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNTQ3NDYsImV4cCI6MjA5NDgzMDc0Nn0.cgCF3t6X7FSo1GITUoWEkhZFC_IuNJ3oIHbfXEkBCho
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -X POST "$URL/rest/v1/rpc/maintenir_actif" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
